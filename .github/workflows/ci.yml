name: CI

# Every job below maps to a failure mode this repository has actually shipped or
# can realistically ship. Nothing here installs Docker Desktop, enables WSL,
# reboots a runner, downloads a model, requires a GPU, or uploads machine
# diagnostics - the installer's own tests are fixture-only for the same reason.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The supported host. This is the gate that has to be green: the full Python
  # suite, strict typing, and the repository's own operational checks.
  windows:
    name: Windows supported host
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Full history: the launcher test proves the pinned bootstrap commit
      # hashes to the pinned digest, and fails (not skips) in CI without it.
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        shell: pwsh
        run: python -m ruff check --no-cache src tests

      - name: Type-check
        shell: pwsh
        run: python -m mypy src

      - name: Run the Python suite
        shell: pwsh
        run: python -m pytest -q

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      # PowerShell parse, JSON parse, compose syntax, the installer preflight
      # regression suite, and static analysis. No stack is started.
      - name: Run operational verification
        shell: pwsh
        run: ./tests/Invoke-Checks.ps1

  # A shipped installer once died on a clean PC because a helper only worked on
  # the author's box. This job proves the pure-Python layer does not silently
  # acquire a Windows-only import at module scope, which is what a later
  # macOS/Linux port would trip over first.
  portable:
    name: Portable Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: python -m ruff check --no-cache src tests

      - name: Import every module without a Windows host
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import localai
          failed = []
          checked = 0
          for mod in pkgutil.iter_modules(localai.__path__, "localai."):
              # __main__ is the CLI entry point: importing it RUNS the app.
              if mod.name.rpartition(".")[2].startswith("__"):
                  continue
              checked += 1
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:  # noqa: BLE001 - reporting, not handling
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          if failed:
              print("Modules that do not import off Windows:")
              for line in failed:
                  print(" -", line)
              sys.exit(1)
          print(f"all {checked} localai modules import cleanly")
          PY

      - name: Run the Python suite
        run: python -m pytest -q

  # The public boundary: no private paths, machine names, or owner leakage in
  # tracked files. This repository is the public one, so a leak here is shipped.
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # Runs against THIS checkout. Note the package resolves its repo root from
      # its own location, so an editable install elsewhere would audit the wrong
      # tree - CI installs from the checkout precisely to avoid that.
      - name: Enforce public-readiness boundary
        run: python -m localai public-audit --strict

      - name: Check whitespace
        run: git diff --check

  # Credentials committed to a public repository are the one mistake that cannot
  # be undone by a follow-up commit. Full history, so a leak added and later
  # removed is still caught.
  secrets:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail-closed on a vulnerable or licence-incompatible dependency entering
  # through a pull request. The action requires the repository's Dependency
  # Graph; rather than fail every PR until that is switched on, the job is gated
  # on a repository variable so enabling it is a settings change, not an edit
  # here. Set DEPENDENCY_REVIEW_ENABLED=true once the graph is enabled.
  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
