name: AFK LocalAI Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: afk-localai-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qualify:
    name: Build and qualify exact installer bytes
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Install pinned Inno Setup toolchain
        shell: pwsh
        run: |
          $toolchain = Get-Content ./installer/toolchain.json -Raw | ConvertFrom-Json
          winget install --id $toolchain.inno_setup.package_id --version $toolchain.inno_setup.version --exact --scope user --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed with exit code $LASTEXITCODE." }

      - name: Run full distribution validation
        shell: pwsh
        run: ./scripts/Test-DistributionContracts.ps1

      - name: Build installer once
        id: build
        shell: pwsh
        run: |
          $compiler = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe'
          $result = ./scripts/Build-Installer.ps1 -SkipTests -InnoCompiler $compiler
          "installer=$($result.InstallerPath)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Qualify predecessor-to-candidate upgrade
        shell: pwsh
        run: |
          $compiler = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe'
          ./scripts/Test-LifecycleUpgrade.ps1 `
            -PayloadRoot ./build/release/payload `
            -InnoCompiler $compiler `
            -ReportPath ./build/lifecycle-upgrade-report.json

      - name: Qualify exact production installer lifecycle
        shell: pwsh
        run: |
          ./scripts/Test-InstallerLifecycle.ps1 `
            -InstallerPath '${{ steps.build.outputs.installer }}' `
            -ExpectedSha256 '${{ steps.build.outputs.sha256 }}' `
            -ReportPath ./build/lifecycle-report.json

      - name: Stage certified bytes and evidence without modification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./build/candidate-bundle/evidence -Force | Out-Null
          Copy-Item ./dist/*.exe, ./dist/*.sha256.txt, ./dist/*.payload-manifest.json -Destination ./build/candidate-bundle
          Copy-Item ./build/lifecycle-report.json, ./build/lifecycle-upgrade-report.json -Destination ./build/candidate-bundle
          Copy-Item ./build/lifecycle -Destination ./build/candidate-bundle/evidence/lifecycle -Recurse

      - name: Upload certified release candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: afk-localai-release-candidate
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: build/candidate-bundle/**
