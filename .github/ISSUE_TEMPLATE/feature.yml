name: Feature or improvement
description: Propose a focused improvement to the supported AFK AI Beta experience.
title: "[idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals grounded in a concrete user problem. Broad rewrites, speculative platform expansion, and unrelated bundles are harder to review than one bounded improvement.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user or maintainer problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Installer and setup
        - Control Center and diagnostics
        - Models and hardware fit
        - Local chat and Open WebUI
        - Search and browser features
        - Voice
        - Networking and remote access
        - Privacy and security
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: Optional. Explain constraints or trade-offs if you already have an implementation idea.
  - type: textarea
    id: boundaries
    attributes:
      label: Important boundaries
      description: Note anything that must remain unchanged, such as release pins, local-first defaults, security controls, or supported-platform scope.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal describes one bounded problem rather than combining unrelated changes.
          required: true
