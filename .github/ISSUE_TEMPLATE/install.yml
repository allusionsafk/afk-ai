name: Installation / setup problem
description: Report an AFK AI Beta install, prerequisite, Docker, WSL, or resume failure.
title: "[install] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        AFK AI is Beta software. Please remove credentials, tokens, chats, prompts, documents, private paths, and unrelated machine information before posting.
  - type: input
    id: version
    attributes:
      label: AFK AI version or commit
      description: For the current public AFK AI Beta, this is usually v0.1.7rc1.
      placeholder: v0.1.7rc1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Last installer phase or heading shown
      placeholder: Phase 5a - Docker Desktop
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Paste the exact error text when possible, after removing sensitive information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: reboot
    attributes:
      label: Did Windows or Docker ask for a restart?
      options:
        - No
        - Yes, and I have not restarted yet
        - Yes, and I restarted
        - I am not sure
    validations:
      required: true
  - type: dropdown
    id: docker
    attributes:
      label: Can Docker Desktop open?
      options:
        - Yes
        - No
        - Docker Desktop is not installed
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware details
      description: GPU, RAM, and virtualization information only if relevant. Do not paste a full system inventory.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from the download/command you used and stop at the failure.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, credentials, chats, prompts, documents, and unrelated personal or machine information.
          required: true
